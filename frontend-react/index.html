    <!-- Instant Dark/Light Theme Synchronization Script to prevent color flashes -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('eec_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
